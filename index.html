<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="시간의 흐름에 지지 않는 아름다움을 위한 여정 | 설화수"
    />
    <title>시간의 흐름에 지지 않는 아름다움을 위한 여정 | 설화수</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link href="./dist/output.css" rel="stylesheet" />

    <script
      src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"
      defer
    ></script>
    <script src="./src/js/main.js" defer></script>
  </head>
  <body class="pc:bg-amber-800 mx-auto bg-orange-500 tablet:bg-purple-500">
    <div class="wrapper relative w-full min-w-80 mx-auto bg-pink-500">
      <!-- header -->
      <header class="absolute top-0 left-0 w-full z-10">
        <nav class="h-[60px] flex items-center justify-between bg-red-500 px-5">
          <div class="trigger bg-blue-500 w-[30px] h-[30px]">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="logo bg-yellow-500 w-28 h-10">
            <img src="" alt="" />
          </div>
          <a href="#none" class="search bg-green-500 w-6 h-6"></a>
        </nav>
      </header>
      <!-- mobile-menu -->
      <div class="mobile-menu fixed hidden w-full h-dvh bg-white z-30">
        <div
          class="title-area h-[60px] bg-red-400 w-full flex items-center justify-between p-4"
        >
          <!-- logo -->
          <div class="logo w-[80px] h-[40px] bg-slate-500"></div>
          <!-- exit button -->
          <div class="exit-btn w-6 h-6 bg-blue-600"></div>
        </div>
        <!-- menu -->
        <ul>
          <!-- 1~3 -->
          <li class="border border-black">
            <a href="#none" class="block p-4"> 윤조 </a>
          </li>
          <li class="border border-black">
            <a href="#none" class="block p-4"> 자음생 </a>
          </li>
          <li class="border border-black">
            <a href="#none" class="block p-4"> 기프트 </a>
          </li>
          <!-- 3~6 -->
          <li class="border border-black">
            <a href="#none" class="block p-4"> 베스트 셀러 </a>
          </li>
          <li class="border border-black">
            <a href="#none" class="block p-4"> 제품 </a>
          </li>
          <li class="border border-black">
            <a href="#none" class="block p-4"> 스파 </a>
          </li>
          <!-- 7~8 -->
          <li class="border border-black">
            <a href="#none" class="block p-4"> 플래그십 스토어 </a>
          </li>
          <li class="border border-black">
            <a href="#none" class="block p-4"> ABOUT 설화수 </a>
          </li>
        </ul>
        <div class="footer h-full bg-black">
          <!-- login/store search -->
          <ul class="border-b border-b-white px-4 py-2">
            <li>
              <a href="#none" class="block py-2 text-white">
                <span class="underline"> 로그인 </span>
              </a>
            </li>
            <li>
              <a href="#none" class="block py-2 text-white"> 매장찾기 </a>
            </li>
          </ul>
          <div class="language">
            <ul class="px-4 py-4 flex justify-between">
              <li>
                <a href="#none" class="text-white"> LANGUAGE </a>
              </li>
              <li>
                <a href="#none" class="text-white"> 한국/한국어 </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <!-- search -->
      <div class="search absolute hidden h-[60px] w-full bg-yellow-500 top-[60px] z-10 p-4 flex items-center">
        <input type="text" placeholder="검색어를 입력해주세요" class="w-full border-b border-b-black outline-none placeholder:text-gray-500 h-[40px]">
        <button class="shrink-0 ml-2 w-[70px] h-[40px] bg-black text-white">검색</button>
      </div>
      <!-- main -->
      <main>
        <div
          class="visual-slide swiper w-full h-[clamp(500px,149vw,1100px)] tablet:h-[clamp(250px,35vw,360px)] pc:h-[35vw] overflow-hidden"
        >
          <div class="swiper-wrapper h-full">
            <div class="swiper-slide bg-purple-500 md:bg-purple-500">
              <h2>Slide 1</h2>
              <picture>
                <source
                  srcset="./public/images/pc__coverpage-main.jpg"
                  media="(min-width: 1024px)"
                />
                <source
                  srcset="./public/images/tab__coverpage-main.jpg"
                  media="(min-width: 721px)"
                />
                <img
                  src="./public/images/coverpage-main.jpg"
                  alt="설화수 자음생크림 캠페인"
                  class="absolute inset-0 w-full h-full object-cover object-center"
                />
              </picture>
            </div>
            <div class="swiper-slide bg-blue-500">
              <h2>Slide 2</h2>
            </div>
            <div class="swiper-slide bg-green-500">
              <h2>Slide 3</h2>
            </div>
          </div>
        </div>
      </main>
      <!-- 1 -->
      <section
        class="recommend w-full px-5 bg-amber-300 text-center mt-[30px] max-w-[1440px] mx-auto"
      >
        <h1 class="text-2xl font-semibold">설화수 추천</h1>
        <div class="recommend-container relative bg-gray-800 mt-[22px]">
          <div
            class="recommend-slide swiper static w-full h-[clamp(420px,calc(100vw+95px),880px)] tablet:h-[clamp(400px,calc(33.3vw+117px),600px)]"
          >
            <div class="swiper-wrapper">
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
              <div class="swiper-slide flex flex-col border border-black">
                <div class="slide-img aspect-[1/1] bg-green-600"></div>
                <div
                  class="slide-text bg-purple-400 w-full h-[95px] tablet:h-[85px] pc:h-[115px]"
                ></div>
              </div>
            </div>
            <!-- pagination -->
            <div
              class="swiper-pagination absolute bottom-0 border-4 border-blue-800"
            ></div>
            <!-- prev / next -->
            <div
              class="swiper-button-prev top-[calc(50%-47.5px)] -translate-y-1/2 left-0 [--swiper-navigation-size:35px] mt-0 border border-black"
            ></div>
            <div
              class="swiper-button-next top-[calc(50%-47.5px)] -translate-y-1/2 right-0 [--swiper-navigation-size:35px] mt-0 border border-black"
            ></div>
          </div>
        </div>
      </section>

      <!-- 2 -->
      <section class="mt-10 w-full bg-blue-500 max-w-[1440px] mx-auto px-5">
        <div
          class="promo-img aspect-[280/365] bg-amber-900 tablet:aspect-[680/255]"
        >
          <img src="" alt="" />
        </div>
      </section>
      <!-- 3 -->
      <section class="max-w-[1440px] mx-auto px-5 mt-10 text-center">
        <h1>설화수 시즌추천</h1>
        <div
          class="season-wrapper mt-5 grid grid-cols-2 tablet:grid-cols-[158fr_328fr_158fr] tablet:items-center tablet:gap-x-4"
        >
          <div class="relative col-span-2 tablet:col-span-1">
            <div
              class="season-img bg-slate-800 aspect-[280/205] w-full tablet:aspect-[328/288]"
            ></div>
            <div
              class="season-title mt-4 w-full bg-teal-500 tablet:absolute tablet:bottom-4 tablet:left-0 tablet:right-0 tablet:mt-0"
            >
              <h2>고밀도 피부를 위한</h2>
              <p>2 STEP 자생력 케어</p>
            </div>
          </div>
          <div
            class="aspect-[135/250] bg-yellow-200 border border-black tablet:aspect-auto tablet:h-full tablet:col-start-1 tablet:row-start-1"
          ></div>
          <div
            class="aspect-[135/250] bg-yellow-200 border border-black tablet:aspect-auto tablet:h-full tablet:col-start-3 tablet:row-start-1"
          >
            테스트입니다.
          </div>
        </div>
      </section>
      <!-- 4 -->
      <section class="max-w-[1440px] mx-auto px-5 mt-16 text-center">
        <div class="store-wrapper grid tablet:grid-cols-2 tablet:gap-x-5">
          <div class="item">
            <div class="store-img aspect-[280/235] bg-teal-600"></div>
            <div class="store-text bg-red-400 h-[95px]">테스트입니다.</div>
          </div>
          <div class="item">
            <div class="store-img aspect-[280/235] bg-teal-600"></div>
            <div class="store-text bg-red-400 h-[95px]">테스트입니다.</div>
          </div>
        </div>
      </section>
      <!-- footer -->
      <footer class="mt-20">
        <div class="footer-sns flex bg-yellow-500 w-full h-[50px]"></div>
        <div class="footer-menu hidden"></div>
        <div class="footer-copy bg-slate-600 h-[95px]"></div>
      </footer>
    </div>
  </body>
</html>
